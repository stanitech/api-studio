<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Chat UI Smoke Test</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div style="padding:20px;max-width:800px;margin:0 auto">
    <h3>Chat UI Smoke Test</h3>
    <div id="testArea">
      <textarea id="chatInput" rows="2" style="width:100%"></textarea>
      <button id="chatEmojiBtn" class="chat-emoji-btn">😊</button>
      <div id="chatEmojiPicker" class="chat-emoji-picker" style="display:none"></div>
      <button id="chatMuteBtn" class="chat-mute-btn">🔔</button>
    </div>
    <div id="results" style="margin-top:16px;font-family:monospace"></div>
  </div>
  <script src="/js/app.js"></script>
  <script>
    // Basic checks
    const results = document.getElementById('results');
    function pass(msg){ results.innerHTML += '\n✅ '+msg; }
    function fail(msg){ results.innerHTML += '\n❌ '+msg; }
    try{
      if (typeof toggleEmojiPicker === 'function') pass('toggleEmojiPicker present'); else fail('toggleEmojiPicker missing');
      if (typeof insertEmoji === 'function') pass('insertEmoji present'); else fail('insertEmoji missing');
      if (typeof initChatAudio === 'function') pass('initChatAudio present'); else fail('initChatAudio missing');
      // Try clicking emoji button
      document.getElementById('chatEmojiBtn').click();
      setTimeout(()=>{
        const p = document.getElementById('chatEmojiPicker');
        if (p && getComputedStyle(p).display !== 'none') pass('emoji picker shown on click'); else fail('emoji picker did not show');
        // insert first emoji if any
        const first = p.querySelector('button');
        if (first) { first.click(); pass('emoji insert button exists'); }
        else fail('no emoji buttons built');
      },400);
    }catch(err){ fail('exception: '+err.message); }
  </script>
</body>
</html>
